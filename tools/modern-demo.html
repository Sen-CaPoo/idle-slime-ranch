<!doctype html>
<meta charset="utf-8">
<title>現代背景展示</title>
<style>
  body { margin: 0; background: #0a1838; color: #e8eef8; font: 14px system-ui, "Microsoft JhengHei", sans-serif; }
  #wrap { max-width: 1280px; margin: auto; padding: 12px 16px; }
  canvas#view { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  button { background: #14306e; color: #fff; border: 2px solid #dfe6f2; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  button.on { background: #f0c850; color: #14306e; }
  #info { font-family: monospace; opacity: .8; }
</style>
<div id="wrap">
  <canvas id="view"></canvas>
  <div class="bar" id="zones"></div>
  <div class="bar" id="quals"></div>
  <div class="bar"><button id="cam">鏡頭搖動</button><span id="info"></span></div>
  <p>scenes-modern.js 的展示頁。角色是臨時的示意圖形，正式角色由 27 的向量 sprite 提供。</p>
</div>
<script>document.write('<script src="../js/hd2d.js?' + Date.now() + '"><\/script><script src="../js/scenes-modern.js?' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  const W = 1280, H = 720;
  function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
  const actors = layer(), ui = layer();
  let zone = 'meadow', shake = false;
  // 臨時示意角色：圓頂果凍形（我們自己的造型），賽璐璐兩階＋描邊
  function slime(x, y, r, body, t) {
    const c = actors.getContext('2d'), sq = 1 + Math.sin(t * 3) * 0.04;
    c.save(); c.translate(x, y); c.scale(1 / sq, sq);
    c.fillStyle = 'rgba(30,50,40,0.25)'; c.beginPath(); c.ellipse(0, 4, r * 1.05, r * 0.25, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.moveTo(-r, 0); c.bezierCurveTo(-r, -r * 1.35, r, -r * 1.35, r, 0); c.closePath();
    c.fillStyle = body; c.fill(); c.lineWidth = 2.5; c.strokeStyle = 'rgba(20,60,30,0.9)'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.55)'; c.beginPath(); c.ellipse(-r * 0.4, -r * 0.65, r * 0.28, r * 0.14, -0.5, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#1a2a40'; [-0.3, 0.3].forEach(function (e) { c.beginPath(); c.ellipse(e * r, -r * 0.45, r * 0.11, r * 0.16, 0, 0, Math.PI * 2); c.fill(); });
    c.restore();
  }
  const view = document.getElementById('view');
  const ok = HD2D.init(view, { quality: 'high' });
  HD2D.autoQuality = false;
  const info = document.getElementById('info');
  function buttons(id, items, cur, fn) {
    const el = document.getElementById(id); el.innerHTML = '';
    items.forEach(function (k) { const b = document.createElement('button'); b.textContent = k; if (k === cur()) b.className = 'on'; b.onclick = function () { fn(k); buttons(id, items, cur, fn); }; el.appendChild(b); });
  }
  buttons('zones', SceneModern.zones(), function () { return zone; }, function (k) { zone = k; SceneModern.prepare(k); });
  buttons('quals', HD2D.qualities, function () { return HD2D.getQuality(); }, function (k) { HD2D.setQuality(k); });
  document.getElementById('cam').onclick = function () { shake = !shake; };
  window.addEventListener('resize', function () { HD2D.resize(2); });
  function loop(now) {
    const t = now / 1000;
    const L = SceneModern.layers(zone, t), M = SceneModern.meta(zone);
    const a = actors.getContext('2d'); a.clearRect(0, 0, W, H);
    // window.demoWhite = true 時改用白色系角色（驗收：白色角色在亮場景要看得清楚）
    const cols = window.demoWhite ? ['#f8f4ff', '#fff4d0', '#f0f6ff'] : ['#7fd36a', '#6ab8ff', '#ffc04a'];
    slime(420, 560, 34, cols[0], t); slime(640, 590, 44, cols[1], t + 1); slime(860, 540, 30, cols[2], t + 2);
    SceneModern.drawFx(a, zone, t);
    const u = ui.getContext('2d'); u.clearRect(0, 0, W, H);
    u.font = 'bold 40px "M PLUS Rounded 1c", system-ui'; u.lineWidth = 6; u.strokeStyle = '#14306e'; u.fillStyle = '#ffe27a';
    u.strokeText('+1.28K', 600, 470); u.fillText('+1.28K', 600, 470);
    if (ok) HD2D.frame({
      style: 'modern',
      layers: [
        { name: 'sky', canvas: L.sky.canvas, version: L.sky.version, depth: 0, parallax: 0.05 },
        { name: 'far', canvas: L.far.canvas, version: L.far.version, depth: 0.2, parallax: 0.2 },
        { name: 'ground', canvas: L.ground.canvas, version: L.ground.version, depth: 0.6, parallax: 0.7 },
        { name: 'mid', canvas: L.mid.canvas, version: L.mid.version, depth: 0.6, parallax: 0.7 },
        { name: 'actors', canvas: actors, depth: 0.65, parallax: 0.7 },
        { name: 'fg', canvas: L.fg.canvas, version: L.fg.version, depth: 1, parallax: 1.3 },
        { name: 'ui', canvas: ui, depth: -1 }
      ],
      camera: { x: shake ? Math.sin(t * 0.6) * 10 : 0, y: 0, zoom: 1.03 },
      lights: SceneModern.lights(zone, t), grade: M.grade, godRays: M.godRays, fog: M.fog,
      focusDepth: M.focusDepth, tiltShift: M.tiltShift, actorRim: M.actorRim, actorAmbientMin: M.actorAmbientMin, time: t
    });
    info.textContent = ok ? (HD2D.getQuality() + ' · ' + HD2D.stats.fps.toFixed(0) + ' fps · 合成 ' + HD2D.stats.ms.toFixed(2) + ' ms · 輸出 ' + view.width + '×' + view.height) : '不支援 WebGL2';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
