<!doctype html>
<meta charset="utf-8">
<title>HD2D 合成器展示</title>
<style>
  body { margin: 0; background: #0b0f22; color: #e8e0c8; font: 14px system-ui, "Microsoft JhengHei", sans-serif; }
  #wrap { max-width: 1280px; margin: auto; padding: 12px 16px; }
  canvas#view { width: 100%; aspect-ratio: 16 / 9; display: block; image-rendering: pixelated; background: #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  button { background: #1a2244; color: #e8d9a8; border: 1px solid #c9a656; padding: 4px 10px; cursor: pointer; }
  button.on { background: #c9a656; color: #141a33; }
  #info { font-family: monospace; opacity: .8; }
</style>
<div id="wrap">
  <canvas id="view"></canvas>
  <div class="bar" id="grades"></div>
  <div class="bar" id="quals"></div>
  <div class="bar"><button id="flash">白閃</button><button id="cam">鏡頭搖動</button><span id="info"></span></div>
  <p>這是 hd2d.js 的獨立展示頁（程式產生的測試圖層，不是正式美術）。render.js 只要照同樣的格式送圖層和光源就能接上。</p>
</div>
<script>document.write('<script src="../js/hd2d.js?' + Date.now() + '"><\/script>'); // 展示頁每次都拿最新版</script>
<script>
(function () {
  const W = 320, H = 180;
  function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
  const L = { sky: layer(), far: layer(), mid: layer(), ground: layer(), actors: layer(), fg: layer(), ui: layer() };
  const PAL = {
    meadow:  { sky: ['#7ab8ff', '#d8ecff'], far: '#6a8ac0', ground: '#4caf50', groundD: '#2e7d32' },
    beach:   { sky: ['#4a3a8a', '#ff9a6a'], far: '#5a4a8a', ground: '#e8c890', groundD: '#c09a60' },
    volcano: { sky: ['#0a0612', '#3a1018'], far: '#2a1018', ground: '#3a2a2a', groundD: '#1a1010' },
    snow:    { sky: ['#a8b8d0', '#e8f0f8'], far: '#90a8c8', ground: '#f0f6ff', groundD: '#b8c8e0' },
    sky:     { sky: ['#4a8ae8', '#cce6ff'], far: '#ffffff', ground: '#c8d8f0', groundD: '#98a8c8' },
    battle:  { sky: ['#0e0a18', '#1e1830'], far: '#2a2440', ground: '#3a3448', groundD: '#22202e' }
  };
  let grade = 'meadow', flash = 0, shake = false;
  function px(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
  function paintStatic() {
    const P = PAL[grade];
    let c = L.sky.getContext('2d'); const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, P.sky[0]); g.addColorStop(1, P.sky[1]); c.fillStyle = g; c.fillRect(0, 0, W, H);
    // 用 4 階色帶模擬像素天空
    for (let y = 0; y < H; y += 6) { c.globalAlpha = 0.06; c.fillStyle = y % 12 ? '#fff' : '#000'; c.fillRect(0, y, W, 3); }
    c.globalAlpha = 1;
    if (grade !== 'volcano' && grade !== 'battle') { px(c, 220, 20, 14, 14, '#fff8d0'); px(c, 218, 22, 18, 10, '#fff8d0'); }
    else for (let i = 0; i < 40; i++) px(c, (i * 73) % W, (i * 37) % 80, 1, 1, '#fff');
    c = L.far.getContext('2d'); c.clearRect(0, 0, W, H); c.fillStyle = P.far;
    for (let x = 0; x < W; x++) { const h = 30 + Math.sin(x * 0.03) * 14 + Math.sin(x * 0.11) * 5; c.fillRect(x, 110 - h, 1, h + 10); }
    if (grade === 'volcano') { c.fillStyle = '#ff5a20'; for (let i = 0; i < 6; i++) c.fillRect(150 + i * 2, 60 + i * 6, 2, 50); }
    c = L.mid.getContext('2d'); c.clearRect(0, 0, W, H);
    if (grade !== 'battle') {
      px(c, 230, 78, 30, 26, '#b03030'); px(c, 228, 72, 34, 8, '#7a1a1a'); px(c, 240, 90, 10, 14, '#3a1a10');
      for (let x = 0; x < W; x += 12) { px(c, x, 96, 3, 16, '#8a5a30'); }
      px(c, 0, 100, W, 3, '#a87040'); px(c, 0, 106, W, 2, '#a87040');
      px(c, 40, 60, 26, 30, '#2e7d32'); px(c, 50, 86, 6, 20, '#5a3a20');
    } else {
      for (let x = 0; x < W; x += 20) for (let y = 30; y < 120; y += 10) px(c, x + (y % 20 ? 10 : 0), y, 19, 9, '#3a3448');
      px(c, 58, 50, 4, 20, '#6a4a2a'); px(c, 258, 50, 4, 20, '#6a4a2a');
    }
    c = L.ground.getContext('2d'); c.clearRect(0, 0, W, H);
    px(c, 0, 110, W, 70, P.ground);
    for (let i = 0; i < 400; i++) px(c, (i * 97) % W, 112 + (i * 53) % 68, 2, 1, P.groundD);
    for (let y = 110; y < H; y++) { const w = 10 + (y - 110) * 0.6; px(c, 150 - w / 2 + Math.sin(y * 0.08) * 8, y, w, 1, grade === 'battle' ? '#2a2638' : '#d8b880'); }
    c = L.fg.getContext('2d'); c.clearRect(0, 0, W, H);
    const fgc = grade === 'snow' ? '#ffffff' : grade === 'volcano' ? '#1a0a08' : '#1e5a20';
    for (let i = 0; i < 18; i++) { const x = i < 9 ? i * 4 : W - (i - 9) * 4 - 6; for (let k = 0; k < 40; k++) px(c, x + Math.sin(k * 0.2 + i) * 3, H - k, 3, 1, fgc); }
  }
  function paintDynamic(t) {
    const c = L.actors.getContext('2d'); c.clearRect(0, 0, W, H);
    const cols = ['#5fd35f', '#4fa8ff', '#ffd23f', '#ff6fb5'];
    cols.forEach(function (col, i) {
      const x = 90 + i * 40, y = 140 + Math.abs(Math.sin(t * 3 + i)) * -6;
      c.globalAlpha = 0.35; px(c, x - 1, 151, 14, 3, '#000'); c.globalAlpha = 1;
      px(c, x, y, 12, 9, col); px(c, x + 1, y - 2, 10, 2, col); px(c, x + 2, y + 1, 3, 2, '#fff');
      px(c, x + 3, y + 3, 2, 2, '#1a1a2e'); px(c, x + 7, y + 3, 2, 2, '#1a1a2e');
    });
    for (let i = 0; i < 20; i++) { const s = (t * 0.2 + i * 0.37) % 1; px(c, (i * 61 + Math.sin(t + i) * 8) % W, grade === 'snow' ? s * H : H - s * 120, 1, 1, grade === 'volcano' ? '#ffb050' : '#fff8c0'); }
    const u = L.ui.getContext('2d'); u.clearRect(0, 0, W, H);
    u.fillStyle = '#ffd23f'; u.font = '8px monospace'; u.fillText('+128  UI 層不做後製', 6, 12);
  }
  function lights(t) {
    const out = [];
    if (grade === 'volcano') { out.push({ x: 157, y: 90, radius: 120, color: '#ff5a20', intensity: 1.6, flicker: 0.5, layer: 'far' }); out.push({ x: 157, y: 150, radius: 90, color: '#ff7a30', intensity: 1.1, flicker: 0.6, layer: 'ground' }); }
    if (grade === 'battle') {
      // 火把本身（照亮牆面＋光暈）和下方地面的光池
      [60, 260].forEach(function (x) {
        out.push({ x: x, y: 55, radius: 80, color: '#ffb040', intensity: 1.8, flicker: 0.6, layer: 'mid' });
        out.push({ x: x, y: 140, radius: 75, color: '#ff9a30', intensity: 1.6, flicker: 0.6, layer: 'ground', halo: 0 });
      });
    }
    out.push({ x: 166 + Math.sin(t) * 40, y: 140, radius: 36, color: '#ffd23f', intensity: 0.9, layer: 'actors' });
    out.push({ x: 245, y: 96, radius: 30, color: '#ffe0a0', intensity: grade === 'beach' ? 1.2 : 0.4, layer: 'mid' });
    return out;
  }
  const view = document.getElementById('view');
  const ok = HD2D.init(view, { quality: 'high' });
  const info = document.getElementById('info');
  if (!ok) info.textContent = '這台裝置不支援 WebGL2，render 會改用 2D。';
  function buttons(id, items, cur, fn) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    items.forEach(function (k) {
      const b = document.createElement('button'); b.textContent = k; if (k === cur()) b.className = 'on';
      b.onclick = function () { fn(k); buttons(id, items, cur, fn); }; el.appendChild(b);
    });
  }
  buttons('grades', Object.keys(PAL), function () { return grade; }, function (k) { grade = k; paintStatic(); });
  buttons('quals', HD2D.qualities, function () { return HD2D.getQuality(); }, function (k) { HD2D.autoQuality = false; HD2D.setQuality(k); });
  document.getElementById('flash').onclick = function () { flash = 1; };
  document.getElementById('cam').onclick = function () { shake = !shake; };
  paintStatic();
  window.addEventListener('resize', function () { HD2D.resize(); });
  function loop(now) {
    const t = now / 1000;
    paintDynamic(t);
    flash = Math.max(0, flash - 0.04);
    if (ok) HD2D.frame({
      layers: L, grade: grade, time: t, lights: lights(t), flash: flash,
      camera: { x: shake ? Math.sin(t * 0.7) * 12 : 0, y: 0, zoom: shake ? 1 + Math.sin(t * 0.5) * 0.04 : 1 },
      focusDepth: 0.65, tiltShift: 0.7
    });
    info.textContent = ok ? (HD2D.getQuality() + ' · ' + HD2D.stats.fps.toFixed(0) + ' fps · 合成 ' + HD2D.stats.ms.toFixed(2) + ' ms · 輸出 ' + view.width + '×' + view.height) : info.textContent;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
